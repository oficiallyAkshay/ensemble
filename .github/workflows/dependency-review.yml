# Reviews the dependency changes a pull request makes and fails when it adds a package with a known vulnerability.
# It reads the dependency graph diff from the GitHub API; it checks out nothing and never writes to the repository.
name: dependency-review

on:
  pull_request:

permissions: {}

# A second push to a pull request supersedes the first, so cancel the run it replaced.
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
