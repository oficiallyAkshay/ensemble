# Publishes the website (docs/index.html, docs/logo.png, docs/live/) to the gh-pages branch, which GitHub Pages serves
# next to the update feed (appcast.xml, written by release.yml). Runs only when those files change on main.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/logo.png"
      - "docs/live/**"

permissions: {}

# One publish at a time, newest wins; a superseded run has nothing left to publish.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # pushes the site files to gh-pages
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false

      - name: Copy the site next to the appcast
        run: |
          cp src/docs/index.html src/docs/logo.png pages/
          rm -rf pages/live
          cp -R src/docs/live pages/live
          rm -rf pages/live/test

      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html logo.png live
          if git diff --cached --quiet; then echo "site unchanged"; exit 0; fi
          git commit -m "Site: ${SHA}"
          # The checkout keeps no credentials; the push gets the token from gh's credential helper, never from a URL.
          git -c credential.helper= -c credential.helper='!gh auth git-credential' push origin HEAD:gh-pages
